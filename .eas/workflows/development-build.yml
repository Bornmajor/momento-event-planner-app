# Android development build (dev client APK). No `on:` trigger, so it only runs manually:
#   npx eas-cli@latest workflow:run .eas/workflows/development-build.yml
# Rebuild only when native dependencies or app.json plugins change; JS changes reload on the existing build.
name: Development build (Android)

jobs:
  build_android_development:
    name: Build Android development client
    type: build
    params:
      platform: android
      profile: development
